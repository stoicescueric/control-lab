name: Lesson or simulation proposal
description: Propose a curriculum addition with a defined teaching objective and evidence.
title: "[Proposal] "
labels:
  - content
body:
  - type: input
    id: concept
    attributes:
      label: Concept
      description: Name the mathematical, control, or robotics concept.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Curriculum area
      options:
        - Foundations
        - Software architecture
        - Signal processing
        - Localization and odometry
        - Motor dynamics and control theory
        - Path following and kinematics
        - State-space control
        - Trajectory generation and implementation
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Learning objective
      description: State what a reader should be able to explain, calculate, or implement after the lesson.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Engineering context
      description: Describe the FTC or broader engineering use case that makes the concept necessary.
    validations:
      required: true
  - type: textarea
    id: visual
    attributes:
      label: Visual or interactive model
      description: Identify the parameter a reader should manipulate and the behavior it should reveal.
    validations:
      required: true
  - type: textarea
    id: rigor
    attributes:
      label: Mathematical scope
      description: List prerequisites, equations to derive, and non-obvious variables that need explanation.
    validations:
      required: true
  - type: textarea
    id: existing_material
    attributes:
      label: Existing curriculum and prior work
      description: Link nearby Control Lab lessons and explain what this proposal adds rather than duplicates.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Provide papers, official documentation, or authoritative hardware references.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the lesson complete, correct, and reviewable.
      placeholder: |
        - Reader can derive ...
        - Demo exposes ...
        - Tests cover ...
        - Hardware warning explains ...
    validations:
      required: true
  - type: checkboxes
    id: contributor_checks
    attributes:
      label: Contributor checks
      options:
        - label: I searched the existing curriculum for this concept.
          required: true
        - label: I understand that the maintainer may refine or decline the scope.
          required: true
        - label: I will verify AI-assisted output and disclose its use in the pull request.
          required: true
